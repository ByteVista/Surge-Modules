schema: 1

policy:
  allow_upstream_unlock_features: true
  allow_external_unlock_injection: false
  preserve_whole_upstream_module: true
  mirror_all_runtime_dependencies: true
  module_category: AdBlock

bundles:
  video:
    module: Video.sgmodule
    description: 视频类总模块
    publish_individual_modules: false
    merge_strategy: merge_same_named_sections
    deduplicate: exact_duplicate_lines_only
  myblockads:
    module: MyBlockAds.sgmodule
    description: MyBlockAds 软件合集
    source_prefixes:
      - MyBlockAds/
    publish_individual_modules: false
    merge_strategy: merge_same_named_sections
    deduplicate: exact_duplicate_lines_only
  alibaba:
    module: AlibabaFamily.sgmodule
    description: 阿里系合集
    source_prefixes:
      - AlibabaFamily/
    publish_individual_modules: false
    merge_strategy: merge_same_named_sections
    deduplicate: exact_duplicate_lines_only
  bytedance:
    module: ByteDanceFamily.sgmodule
    description: 字节系合集
    source_prefixes:
      - ByteDanceFamily/
    publish_individual_modules: false
    merge_strategy: merge_same_named_sections
    deduplicate: exact_duplicate_lines_only
  meituan:
    module: MeituanFamily.sgmodule
    description: 美团系合集
    source_prefixes:
      - MeituanFamily/
    publish_individual_modules: false
    merge_strategy: merge_same_named_sections
    deduplicate: exact_duplicate_lines_only
  finance:
    module: Finance.sgmodule
    description: 金融软件合集
    source_prefixes:
      - Finance/
    publish_individual_modules: false
    merge_strategy: merge_same_named_sections
    deduplicate: exact_duplicate_lines_only

