<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>安装 Surge 上游模块</title>
<style>body{font-family:system-ui,sans-serif;max-width:640px;margin:64px auto;padding:0 24px;line-height:1.8}a,code{overflow-wrap:anywhere}code{display:block;white-space:pre-wrap}</style>
<h1>安装 Surge 上游模块</h1>
<p id="status">正在准备安装链接…</p>
<p><a id="install" hidden>打开 Surge 安装</a></p>
<p><a id="source" hidden>直接上游订阅</a></p>
<code id="scheme"></code>
<noscript>请返回 README，复制“上游订阅”地址，在 Surge 的“从 URL 安装”中粘贴。</noscript>
<script>
(() => {
  const input = new URLSearchParams(location.hash.slice(1)).get('url');
  let url;
  try { url = new URL(input); } catch {}
  if (!url || url.protocol !== 'https:' || url.username || url.password ||
      !['raw.githubusercontent.com', 'github.com'].includes(url.hostname)) {
    document.getElementById('status').textContent = '安装链接无效，请返回 README 重新选择。';
    return;
  }
  const scheme = 'surge:///install-module?url=' + encodeURIComponent(url.href);
  const install = document.getElementById('install');
  install.href = scheme;
  install.hidden = false;
  const source = document.getElementById('source');
  source.href = url.href;
  source.hidden = false;
  source.textContent = '直接上游订阅：' + url.href;
  document.getElementById('scheme').textContent = scheme;
  document.getElementById('status').textContent = '正在打开 Surge。若未跳转，请点击“打开 Surge 安装”并允许浏览器打开应用；也可复制上游链接在 Surge 中安装。';
  location.href = scheme;
})();
</script>
</html>
