name: Sync Surge Modules

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: surge-module-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    services:
      script-hub:
        image: xream/script-hub:latest
        ports:
          - 9100:9100
          - 9101:9101

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --requirement requirements.txt

      - name: Validate configuration and run tests
        run: |
          python scripts/validate_modules.py --config-only
          python -m unittest discover -s tests -v

      - name: Wait for Script-Hub
        shell: bash
        run: |
          for attempt in {1..30}; do
            if timeout 1 bash -c '</dev/tcp/127.0.0.1/9100' 2>/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Script-Hub did not become ready" >&2
          exit 1

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Fetch, convert, and assemble modules
        env:
          MODULE_RAW_BASE: ${{ steps.pages.outputs.base_url }}/Modules/Surge
          SCRIPT_HUB_URL: http://127.0.0.1:9100
        shell: bash
        run: |
          for attempt in 1 2; do
            if python scripts/sync_modules.py --readme README.md; then
              exit 0
            fi
            if [ "$attempt" -eq 2 ]; then
              exit 1
            fi
            echo "Sync attempt failed; waiting 45 seconds before one full retry"
            sleep 45
          done

      - name: Validate generated modules
        run: python scripts/validate_modules.py

      - name: Commit updated modules
        shell: bash
        run: |
          if git diff --quiet -- Modules/Surge README.md; then
            echo "No upstream changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Modules/Surge README.md
          git commit -m "chore: sync upstream Surge modules"
          git push

      - name: Build public Pages files
        run: python scripts/build_pages.py --modules Modules/Surge --readme README.md --site _site

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
