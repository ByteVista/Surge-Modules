name: Check upstream subscriptions
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: catalog-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run catalog tests
        run: python -m unittest discover -s tests -v
      - name: Check generated README
        run: python scripts/catalog.py --check
      - name: Check upstream modules and runtime resources
        if: github.event_name != 'pull_request'
        run: python scripts/catalog.py --check --check-links
